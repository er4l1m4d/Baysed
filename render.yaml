# Baysed $0 Architecture
# - Render Free Web Service (API + Bot in one process)
# - Neon PostgreSQL (free tier)
# - Vercel (terminal frontend)
# - UptimeRobot (free, 5-min health checks)

services:
  # Combined API Server + Trading Engine
  - type: web
    name: bayse-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m api.run
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BOT_RUN_MODE
        value: observation
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard (Neon connection string)
      - key: BAYSE_BASE_URL
        value: https://relay.bayse.markets
      - key: BAYSE_PUBLIC_KEY
        sync: false
      - key: BAYSE_SECRET_KEY
        sync: false
      - key: SERIES_SLUG
        value: crypto-btc-15min
      - key: TRADE_CURRENCY
        value: USD
    healthCheckPath: /health

# Note: DATABASE_URL should be set to your Neon connection string
# Format: postgresql://user:password@ep-xxx.us-east-2.aws.neon.tech/dbname?sslmode=require
#
# Neon Free Tier:
# - 100 CU-hours/month
# - 0.5 GB storage
# - Scales to zero after inactivity
# - https://neon.com
